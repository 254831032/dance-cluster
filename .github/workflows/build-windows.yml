name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg (win64 essentials)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force -Path .tools/bin | Out-Null
          $ff = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName .tools/bin/ffmpeg.exe
          Copy-Item $fp.FullName .tools/bin/ffprobe.exe
          .tools/bin/ffmpeg.exe -version

      - name: Download pose model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          foreach ($m in @("heavy", "full", "lite")) {
            Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_$m/float16/1/pose_landmarker_$m.task" -OutFile "models/pose_landmarker_$m.task"
          }
          Get-ChildItem models | Select-Object Name, Length

      - name: Build exe
        run: pyinstaller --noconfirm dance-cluster.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanceCluster-windows
          path: dist/DanceCluster.exe
          retention-days: 30
